[project]
name = "ani-sub"
version = "0.0.1"
description = "ani-cli subtitle plugin"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "platformdirs>=4.12.4",
    "pyyaml>=6.0.3",
    "questionary>=2.1.1",
    "tomli>=2.5.0",
    "tomli-w>=1.2.0",
    "typer>=0.27.3",
]

[project.scripts]
ani-sub = "ani_sub.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
